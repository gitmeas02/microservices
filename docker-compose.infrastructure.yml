version: '3.8'

services:
  # =============================================================================
  # KEYCLOAK - Identity and Access Management
  # =============================================================================
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - infrastructure
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================================================
  # RABBITMQ - Message Broker
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # MINIO - S3 Compatible Object Storage
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    volumes:
      - minio_data:/data
    networks:
      - infrastructure
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # KRAKEND - High-Performance API Gateway
  # =============================================================================
  krakend:
    image: devopsfaith/krakend:2.5
    container_name: krakend-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"   # API Gateway port
      - "8090:8090"   # Metrics port
    volumes:
      - ./infrastructure/krakend/krakend.json:/etc/krakend/krakend.json:ro
    networks:
      - infrastructure
    depends_on:
      - keycloak
      - rabbitmq
      - minio
    environment:
      - KRAKEND_PORT=8000
      - KRAKEND_CONFIG=/etc/krakend/krakend.json
    command: ["run", "-d", "-c", "/etc/krakend/krakend.json"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/__health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================================================
  # GITLAB - Git Repository Management & CI/CD
  # =============================================================================
  gitlab:
    image: gitlab/gitlab-ce:16.7.0-ce.0
    container_name: gitlab
    restart: unless-stopped
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local:8082'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = 'admin123456'
        gitlab_rails['smtp_enable'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        # Performance settings for local development
        postgresql['shared_buffers'] = "128MB"
        gitlab_rails['gitlab_email_enabled'] = false
        gitlab_ci['gitlab_ci_all_broken_builds'] = false
        gitlab_ci['gitlab_ci_add_pusher'] = false
        # Disable Gitaly timeouts for local dev
        gitaly['configuration'] = {
          listen_addr: '0.0.0.0:8075',
        }
    ports:
      - "8082:80"     # HTTP
      - "8443:443"    # HTTPS
      - "2222:22"     # SSH
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - infrastructure
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/users/sign_in"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  # =============================================================================
  # GITLAB RUNNER - CI/CD Runner
  # =============================================================================
  gitlab-runner:
    image: gitlab/gitlab-runner:alpine3.18-v16.7.0
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infrastructure
    depends_on:
      - gitlab

  # =============================================================================
  # JENKINS - CI/CD Server
  # =============================================================================
  jenkins:
    image: jenkins/jenkins:2.440-lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_OPTS: --httpPort=8081
    ports:
      - "8081:8081"   # Web UI
      - "50000:50000" # Agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/jenkins/plugins.txt:/usr/share/jenkins/ref/plugins.txt
      - ./infrastructure/jenkins/casc.yaml:/var/jenkins_home/casc_configs/jenkins.yaml
    networks:
      - infrastructure
    user: root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================================================
  # SONATYPE NEXUS - Repository Manager
  # =============================================================================
  nexus:
    image: sonatype/nexus3:3.45.0
    container_name: nexus
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=2g"
    ports:
      - "8083:8081"   # Web UI
      - "8084:8082"   # Docker registry (hosted)
      - "8085:8083"   # Docker registry (proxy)
    volumes:
      - nexus_data:/nexus-data
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - infrastructure
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - infrastructure
    depends_on:
      - prometheus

volumes:
  # Keycloak
  keycloak_db_data:
  keycloak_data:
  
  # RabbitMQ
  rabbitmq_data:
  
  # MinIO
  minio_data:
  
  # GitLab
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:
  
  # Jenkins
  jenkins_home:
  
  # Nexus
  nexus_data:
  
  # Monitoring
  prometheus_data:
  grafana_data:

networks:
  infrastructure:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
