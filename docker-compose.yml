version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - keycloak
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_HOST=${REDIS_HOST}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
    volumes:
      - ./services/api-gateway:/app

  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    depends_on:
      - mysql
      - keycloak
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
    volumes:
      - ./services/auth-service:/app

  notification-service:
    build: ./services/notification-service
    ports:
      - "8002:8002"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=${REDIS_HOST}
    volumes:
      - ./services/notification-service:/app

  payment-service:
    build: ./services/payment-service
    ports:
      - "8003:8003"
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_SECRET=${PAYPAL_SECRET}
    volumes:
      - ./services/payment-service:/app

  chat-websocket-service:
    build: ./services/chat-websocket-service
    ports:
      - "8004:8004"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=${REDIS_HOST}
    volumes:
      - ./services/chat-websocket-service:/app

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-gateway

  keycloak:
    image: jboss/keycloak:latest
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin
    volumes:
      - ./keycloak:/etc/keycloak

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
