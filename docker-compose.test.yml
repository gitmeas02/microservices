version: '3.8'

services:
  # Test PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nestjs-test-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test Redis
  redis:
    image: redis:7-alpine
    container_name: nestjs-test-redis
    ports:
      - "6380:6379"
    volumes:
      - test_redis_data:/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: nestjs-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test123
      RABBITMQ_DEFAULT_VHOST: test
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - test_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test MinIO
  minio:
    image: minio/minio:latest
    container_name: nestjs-test-minio
    environment:
      MINIO_ROOT_USER: testadmin
      MINIO_ROOT_PASSWORD: test123456
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - test_minio_data:/data
    networks:
      - test-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  test_postgres_data:
  test_redis_data:
  test_rabbitmq_data:
  test_minio_data:

networks:
  test-network:
    driver: bridge
