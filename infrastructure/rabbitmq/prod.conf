# RabbitMQ Production Configuration
loopback_users.guest = false
listeners.tcp.default = 5672
listeners.ssl.default = 5671

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.ssl.port = 15671
management.ssl.ip = 0.0.0.0

# SSL Configuration
ssl_options.cacertfile = /etc/rabbitmq/ssl/ca-certificate.pem
ssl_options.certfile = /etc/rabbitmq/ssl/server-certificate.pem
ssl_options.keyfile = /etc/rabbitmq/ssl/server-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# Logging
log.console = false
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = warn
log.file.rotation.date = $D0
log.file.rotation.size = 100MB
log.file.rotation.count = 30

# Memory and disk limits (production settings)
vm_memory_high_watermark.relative = 0.4
disk_free_limit.relative = 2.0

# Heartbeat and connection settings
heartbeat = 580
frame_max = 131072
channel_max = 2048
default_user_tags.administrator = true

# Queue settings
default_vhost = /
default_user = ${RABBITMQ_USER}
default_pass = ${RABBITMQ_PASSWORD}

# Clustering
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_name = nestjs-production-cluster

# High Availability
ha_policy_pattern = .*
ha_policy_definition = {"ha-mode":"all","ha-sync-mode":"automatic"}

# Security
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN

# Performance tuning
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0

# Management UI security
management.cors.allow_origins.1 = https://${RABBITMQ_DOMAIN}
management.cors.max_age = 1800

# Rate limiting
channel_max = 2048
connection_max = 65536

# Monitoring
prometheus.tcp.port = 15692
prometheus.path = /metrics
