concurrent = 1
check_interval = 0
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "docker-runner-dev"
  url = "http://gitlab-dev.local:8082"
  token = "REPLACE_WITH_GITLAB_RUNNER_TOKEN"
  executor = "docker"
  [runners.docker]
    tls_verify = false
    image = "node:20-alpine"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
    shm_size = 0
    network_mode = "infrastructure-dev_default"
  [runners.cache]
    Type = "local"
    Path = "/cache"
    Shared = false

[[runners]]
  name = "docker-dind-runner-dev"
  url = "http://gitlab-dev.local:8082"
  token = "REPLACE_WITH_GITLAB_RUNNER_TOKEN"
  executor = "docker"
  [runners.docker]
    tls_verify = false
    image = "docker:20.10.16-dind"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/certs/client", "/cache"]
    environment = ["DOCKER_TLS_CERTDIR=/certs", "DOCKER_DRIVER=overlay2"]
    shm_size = 0
    network_mode = "infrastructure-dev_default"
  [runners.cache]
    Type = "local"
    Path = "/cache"
    Shared = false
