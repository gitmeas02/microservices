concurrent = 4
check_interval = 0
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

# Docker Runner for general builds
[[runners]]
  name = "docker-runner-prod"
  url = "${GITLAB_URL}"
  token = "${GITLAB_RUNNER_TOKEN}"
  executor = "docker"
  [runners.docker]
    tls_verify = false
    image = "node:20-alpine"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 268435456  # 256MB
    network_mode = "infrastructure-prod_default"
    pull_policy = "if-not-present"
    memory = "2g"
    cpus = "1.0"
  [runners.cache]
    Type = "s3"
    Path = "cache"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "${MINIO_ENDPOINT}:9000"
      AccessKey = "${MINIO_ACCESS_KEY}"
      SecretKey = "${MINIO_SECRET_KEY}"
      BucketName = "gitlab-runner-cache"
      Insecure = false

# Docker-in-Docker Runner for container builds
[[runners]]
  name = "docker-dind-runner-prod"
  url = "${GITLAB_URL}"
  token = "${GITLAB_RUNNER_TOKEN}"
  executor = "docker"
  [runners.docker]
    tls_verify = false
    image = "docker:20.10.16-dind"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/certs/client", "/cache"]
    environment = [
      "DOCKER_TLS_CERTDIR=/certs", 
      "DOCKER_DRIVER=overlay2",
      "DOCKER_BUILDKIT=1"
    ]
    shm_size = 268435456  # 256MB
    network_mode = "infrastructure-prod_default"
    memory = "4g"
    cpus = "2.0"
  [runners.cache]
    Type = "s3"
    Path = "cache"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "${MINIO_ENDPOINT}:9000"
      AccessKey = "${MINIO_ACCESS_KEY}"
      SecretKey = "${MINIO_SECRET_KEY}"
      BucketName = "gitlab-runner-cache"
      Insecure = false

# Kubernetes Runner for production deployments
[[runners]]
  name = "kubernetes-runner-prod"
  url = "${GITLAB_URL}"
  token = "${GITLAB_RUNNER_TOKEN}"
  executor = "kubernetes"
  [runners.kubernetes]
    host = "${KUBERNETES_API_SERVER}"
    namespace = "gitlab-runner"
    privileged = false
    cpu_limit = "1"
    memory_limit = "2Gi"
    service_cpu_limit = "200m"
    service_memory_limit = "256Mi"
    helper_cpu_limit = "200m"
    helper_memory_limit = "256Mi"
    poll_timeout = 180
    pod_termination_grace_period_seconds = 10
    image = "node:20-alpine"
    
    # Security context
    [runners.kubernetes.pod_security_context]
      run_as_non_root = true
      run_as_user = 999
      run_as_group = 999
      fs_group = 999
    
    # Resource requests
    [runners.kubernetes.node_selector]
      "node-role.kubernetes.io/worker" = "true"
    
    [runners.kubernetes.node_tolerations]
      "node-role.kubernetes.io/master" = "NoSchedule"

# Shell Runner for specific system tasks (limited use)
[[runners]]
  name = "shell-runner-prod"
  url = "${GITLAB_URL}"
  token = "${GITLAB_RUNNER_TOKEN}"
  executor = "shell"
  shell = "bash"
  [runners.custom_build_dir]
    enabled = true
  [runners.cache]
    Type = "s3"
    Path = "cache"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "${MINIO_ENDPOINT}:9000"
      AccessKey = "${MINIO_ACCESS_KEY}"
      SecretKey = "${MINIO_SECRET_KEY}"
      BucketName = "gitlab-runner-cache"
      Insecure = false
