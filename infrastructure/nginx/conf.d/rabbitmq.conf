# RabbitMQ Message Broker
server {
    listen 80;
    listen 443 ssl;
    server_name rabbit.local rabbitmq.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    location / {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://rabbitmq_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # RabbitMQ Management specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for real-time monitoring
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# RabbitMQ AMQP Port (if needed for external access)
server {
    listen 5672;
    server_name rabbit.local rabbitmq.local;
    
    location / {
        proxy_pass http://rabbitmq:5672;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # TCP proxy settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
