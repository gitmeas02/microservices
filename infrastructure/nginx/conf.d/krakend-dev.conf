# KrakenD API Gateway Configuration - Development
upstream krakend_dev_backend {
    server krakend-dev:8000 max_fails=3 fail_timeout=30s;
}

upstream krakend_dev_metrics_backend {
    server krakend-dev:8090 max_fails=3 fail_timeout=30s;
}

# API Gateway - api.local (Development)
server {
    listen 80;
    listen 443 ssl;
    server_name api.local api-dev.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Development-specific headers
    add_header X-Environment "development" always;
    add_header X-Gateway "krakend-dev" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # CORS headers for API Gateway (Development - more permissive)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With, X-Dev-Token" always;
    add_header Access-Control-Expose-Headers "Content-Length, X-Request-Id, X-Dev-Mode" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With, X-Dev-Token";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }

    # API Gateway endpoints
    location / {
        proxy_pass http://krakend_dev_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Environment "development";
        
        # Development timeouts (more generous)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Development-specific endpoints
    location /dev/ {
        proxy_pass http://krakend_dev_backend/api/v1/dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
    }

    # API Documentation endpoint (enhanced for dev)
    location /docs {
        proxy_pass http://krakend_dev_backend/__debug/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
        
        # Add development documentation headers
        add_header X-API-Docs "KrakenD Development API" always;
        add_header X-Debug-Mode "enabled" always;
    }

    # Echo endpoint for testing
    location /echo {
        proxy_pass http://krakend_dev_backend/__echo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
    }

    # Health check for API Gateway
    location /gateway/health {
        proxy_pass http://krakend_dev_backend/__health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
        access_log off;
    }

    # Metrics endpoint (development access)
    location /gateway/metrics {
        proxy_pass http://krakend_dev_metrics_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
        
        # Development access (no restrictions)
        add_header X-Metrics-Access "development" always;
    }

    # Development debugging endpoint
    location /gateway/debug {
        proxy_pass http://krakend_dev_backend/__debug;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "development";
        
        add_header X-Debug-Access "enabled" always;
    }

    # Error pages
    error_page 502 503 504 /gateway_error.html;
    location = /gateway_error.html {
        root /usr/share/nginx/html;
        internal;
        add_header X-Error-Source "krakend-dev" always;
    }

    # Development logging
    access_log /var/log/nginx/krakend-dev-access.log detailed;
    error_log /var/log/nginx/krakend-dev-error.log debug;
}
