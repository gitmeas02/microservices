# Jenkins CI/CD Pipeline
server {
    listen 80;
    listen 443 ssl;
    server_name ci.local jenkins.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    # Jenkins specific settings
    client_max_body_size 50M;

    location / {
        limit_req zone=api burst=25 nodelay;
        
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Jenkins specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Required for Jenkins CLI and agent connections
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Timeouts for long-running builds
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket support for real-time logs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Jenkins CLI and JNLP agent connections
    location /cli {
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No buffering for CLI
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }
}

# Jenkins agent port (if needed)
server {
    listen 50000;
    server_name ci.local jenkins.local;
    
    location / {
        proxy_pass http://jenkins:50000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
