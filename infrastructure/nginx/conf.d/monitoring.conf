# Monitoring Services - Prometheus & Grafana

# Prometheus Metrics Collection
server {
    listen 80;
    listen 443 ssl;
    server_name prometheus.local metrics.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    location / {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://prometheus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prometheus specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Settings for metrics queries
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        
        # Timeouts for long queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Grafana Dashboards
server {
    listen 80;
    listen 443 ssl;
    server_name grafana.local dashboards.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    location / {
        limit_req zone=api burst=25 nodelay;
        
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Grafana specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for real-time dashboards
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffer settings for dashboard data
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API endpoints for data sources
    location /api/ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for data queries
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
