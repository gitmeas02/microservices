# MinIO Object Storage
server {
    listen 80;
    listen 443 ssl;
    server_name storage.local minio.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    # MinIO specific settings
    client_max_body_size 5G;
    proxy_request_buffering off;

    location / {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://minio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MinIO specific headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Required for MinIO Console
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for large file uploads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }
}

# MinIO API Server (port 9000)
server {
    listen 9000;
    listen 9443 ssl;
    server_name storage.local minio.local;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/dev-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dev-key.pem;

    # MinIO API specific settings
    client_max_body_size 5G;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # S3 API compatibility headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # No buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Extended timeouts for large objects
        proxy_connect_timeout 300;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }
}
