# Nginx Development Configuration
# Optimized for development environment with all services

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log detailed;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting (Development - Lenient)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # Upstream definitions
    upstream keycloak_backend {
        server keycloak:8080 max_fails=3 fail_timeout=30s;
    }

    upstream rabbitmq_backend {
        server rabbitmq:15672 max_fails=3 fail_timeout=30s;
    }

    upstream minio_backend {
        server minio:9001 max_fails=3 fail_timeout=30s;
    }

    upstream gitlab_backend {
        server gitlab:80 max_fails=3 fail_timeout=30s;
    }

    upstream jenkins_backend {
        server jenkins:8081 max_fails=3 fail_timeout=30s;
    }

    upstream nexus_backend {
        server nexus:8081 max_fails=3 fail_timeout=30s;
    }

    upstream prometheus_backend {
        server prometheus:9090 max_fails=3 fail_timeout=30s;
    }

    upstream grafana_backend {
        server grafana:3000 max_fails=3 fail_timeout=30s;
    }

    # Default server block (catches all unmatched requests)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        # SSL configuration (self-signed for development)
        ssl_certificate /etc/nginx/ssl/dev-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/dev-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main landing page
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Include additional server configurations
    include /etc/nginx/conf.d/*.conf;
}
