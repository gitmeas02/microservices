# Nginx Production Configuration
# Optimized for production deployment with enhanced security and performance

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log detailed buffer=64k flush=5s;

    # Performance Settings
    sendfile on;
    sendfile_max_chunk 1M;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # SSL Settings (Production)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-javascript
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # Rate Limiting (Production - Stricter)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream definitions with health checks
    upstream keycloak_backend {
        least_conn;
        server keycloak:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream rabbitmq_backend {
        least_conn;
        server rabbitmq:15672 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream minio_backend {
        least_conn;
        server minio:9001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream gitlab_backend {
        least_conn;
        server gitlab:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream jenkins_backend {
        least_conn;
        server jenkins:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream nexus_backend {
        least_conn;
        server nexus:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream prometheus_backend {
        least_conn;
        server prometheus:9090 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream grafana_backend {
        least_conn;
        server grafana:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Default server block - Security focused
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/production-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/production-key.pem;

        # Security: Return 444 for undefined hosts
        return 444;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name yourdomain.com *.yourdomain.com;
        return 301 https://$server_name$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name yourdomain.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/production-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/production-key.pem;

        # Connection limits
        limit_conn conn_limit_per_ip 20;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status (restricted access)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Security: Block common attack patterns
        location ~* /(\.git|\.svn|\.env|\.htaccess|\.htpasswd|composer\.json|package\.json) {
            deny all;
            return 404;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Main landing page
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Include service-specific configurations
    include /etc/nginx/conf.d/*.conf;

    # Security: Remove unused HTTP methods
    map $request_method $not_allowed_method {
        default 1;
        GET 0;
        POST 0;
        PUT 0;
        DELETE 0;
        HEAD 0;
        OPTIONS 0;
    }

    # Request filtering
    map $http_user_agent $blocked_agent {
        default 0;
        ~*malicious 1;
        ~*bot 1;
        ~*crawl 1;
        ~*scanner 1;
    }

    # GeoIP blocking (if needed)
    # map $geoip_country_code $blocked_country {
    #     default 0;
    #     CN 1;
    #     RU 1;
    # }
}
